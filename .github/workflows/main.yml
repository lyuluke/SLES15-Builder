name: Build and Push Docker Image

# 触发条件：当你提交 Dockerfile 修改，或者在 GitHub 网页上手动点击运行
on:
  push:
    paths:
      - 'Dockerfile' # 只有当 Dockerfile 被修改时才自动触发
      - '.github/workflows/docker-build.yml'
  workflow_dispatch: # 支持在 GitHub 网页界面手动点击按钮触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 使用 GitHub 免费的高速 Linux 服务器

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Docker Buildx (构建引擎)
      - name: Set up Docker Buildx
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 构建并推送到 Docker Hub
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 自动打标签为你 Docker Hub 账号下的 sles15-cqtdeployer-builder:latest
          tags: ${{ vars.DOCKERHUB_USERNAME }}/sles15-cqtdeployer-builder:latest
